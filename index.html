<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gomoku</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <canvas id="board"></canvas>

    <aside>
      <h1>Gomoku</h1>

      <div class="player" id="player-1">
        <span class="stone black"></span>
        <span class="name">Black</span>
        <span class="captures"></span>
      </div>
      <div class="player" id="player-2">
        <span class="stone white"></span>
        <span class="name">White</span>
        <span class="captures"></span>
      </div>

      <p id="status"></p>
      <p id="ai-time"></p>

      <div class="buttons">
        <button id="undo">Undo</button>
        <button id="hint">Hint</button>
        <button id="new-game">New game</button>
        <button id="sound"></button>
      </div>

      <ol id="moves"></ol>
    </aside>
  </main>

  <dialog id="menu">
    <form method="dialog">
      <h2>New game</h2>
      <label>
        Mode
        <select name="mode">
          <option value="computer">Against the computer</option>
          <option value="local">2 players</option>
        </select>
      </label>
      <label>
        You play
        <select name="color">
          <option value="1">Black (you start)</option>
          <option value="2">White</option>
        </select>
      </label>
      <label>
        Opening
        <select name="opening">
          <option value="standard">Standard</option>
          <option value="pro">Pro</option>
          <option value="long-pro">Long pro</option>
        </select>
      </label>
      <button value="start">Start</button>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
