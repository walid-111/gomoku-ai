[package]
name = "game-rs"
version = "0.1.0"
edition = "2018"

[[bin]]
name = "threat_debug"

[[bin]]
name = "cli"

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[[bench]]
name = "profiling"
harness = false

[features]
default = ["console_error_panic_hook", "opening_table"]
opening_table = []

[dependencies]
wasm-bindgen = "0.2.84"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
rand = "0.8.5"
getrandom = { version = "0.2.15", features = ["js"] }
itertools = "0.13.0"
wasm-bindgen-futures = "0.4.47"
serde = "1.0.215"
serde_json = "1.0.133"
futures = "0.3.31"

[dev-dependencies]
wasm-bindgen-test = "0.3.34"
iai-callgrind = "0.12.3"

[profile.dev]
opt-level = 3

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
strip = false
debug = true
